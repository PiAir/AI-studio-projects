<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weefgetouw Digitale Geletterdheid - Definitieve Versie</title>
    <style>
        :root {
            --color-ict-bg: #fff9db; --color-ict-border: #ffd43b;
            --color-mediawijsheid-bg: #e6fcf0; --color-mediawijsheid-border: #8ce99a;
            --color-informatie-bg: #ffeef2; --color-informatie-border: #f783ac;
            --color-computational-bg: #e3fafc; --color-computational-border: #74c0fc;
            --color-border: #dee2e6; --color-header-bg: #f8f9fa;
            --color-text: #212529; --color-primary: #005a9e; --color-primary-light: #e7f5ff;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f1f3f5; color: var(--color-text); margin: 0; padding: 2rem; font-size: 14px;
        }

        .main-container {
            display: grid; grid-template-columns: minmax(550px, 1.2fr) 2fr; gap: 2rem;
            align-items: start; max-width: 1900px; margin: 0 auto;
        }

        h1 { text-align: center; grid-column: 1 / -1; margin-bottom: 2rem; color: var(--color-primary); }
        h2 { margin-top: 0; border-bottom: 2px solid var(--color-border); padding-bottom: 0.5rem; color: #343a40; }
        h3 { font-size: 1.2em; margin: 1.5rem 0 0.8rem; color: #343a40; }
        h4 { font-size: 1em; margin: 0; font-weight: 600; color: #495057; display: inline; }
        
        .panel { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.07); }
        .leerdoelen-bank { max-height: 85vh; overflow-y: auto; }
        
        details { margin-bottom: 0.5rem; }
        summary {
            cursor: pointer; list-style: none; display: block; position: relative;
            padding: 0.4rem 0 0.4rem 1.5em; font-weight: 600;
        }
        summary::-webkit-details-marker { display: none; }
        summary::before {
            content: '►'; position: absolute; left: 0.25em; font-size: 0.8em;
            transition: transform 0.2s; color: #868e96;
        }
        details[open] > summary::before { transform: rotate(90deg); }
        
        .info-sectie > summary { padding: 0.75rem 0 0.75rem 1.5em; }
        .subdomein-details { margin-left: 1rem; }
        .label-details { margin-left: 1.5rem; }
        .label-summary { font-weight: bold; border-top: 1px solid var(--color-border); padding-top: 0.75rem; }

        .inhoudslijn-header { font-size: 1.25em; border-left: 4px solid; padding-left: 0.8rem; margin-bottom: 1rem; }
        .fases-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding-top: 1rem; margin-left: 1.5em; }
        .fase-kolom { min-height: 30px; display: flex; flex-direction: column; }
        .fase-header { font-weight: bold; color: #868e96; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e9ecef; }
        
        .leerdoel { padding: 8px 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid; cursor: grab; user-select: none; font-size: 13px; line-height: 1.4; }
        .leerdoel.dragging { opacity: 0.5; }

        .leerdoel[data-color="ict"] { background-color: var(--color-ict-bg); border-color: var(--color-ict-border); }
        .leerdoel[data-color="mediawijsheid"] { background-color: var(--color-mediawijsheid-bg); border-color: var(--color-mediawijsheid-border); }
        .leerdoel[data-color="informatie"] { background-color: var(--color-informatie-bg); border-color: var(--color-informatie-border); }
        .leerdoel[data-color="computational"] { background-color: var(--color-computational-bg); border-color: var(--color-computational-border); }
        
        .weefgetouw-header { display: flex; justify-content: space-between; align-items: center; }
        .controls { display: flex; gap: 0.5rem; }
        .button { font-family: inherit; font-size: 14px; font-weight: bold; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--color-primary); background-color: var(--color-primary); color: white; cursor: pointer; transition: all 0.2s; }
        .button:hover { background-color: #004b82; }
        .button-secondary { background-color: var(--color-primary-light); color: var(--color-primary); }
        .button-secondary:hover { background-color: #d0ebff; }
        
        .curriculum-grid { display: grid; gap: 6px; }
        .grid-header, .grid-row-header { padding: 0.5rem; text-align: center; font-weight: bold; }
        .grid-row-header { text-align: left; background-color: transparent; padding-left: 0; }
        .grid-cell { background-color: #fff; border: 2px dashed var(--color-border); min-height: 80px; border-radius: 6px; display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 5px; }
        .drag-over { background-color: var(--color-primary-light) !important; border-color: var(--color-primary) !important; border-style: solid !important; }
        
        .bewust-niet-opgenomen { margin-top: 1rem; padding: 1rem; border: 2px dashed #adb5bd; border-radius: 8px; min-height: 80px; background-color: var(--color-header-bg); display: flex; flex-wrap: wrap; gap: 0.5rem; align-content: flex-start; }
        .footer { text-align: center; margin-top: 2rem; font-size: 0.9em; color: #868e96; grid-column: 1 / -1; }
        
        @media print {
            body { background-color: #fff; padding: 0; margin: 0; font-size: 10pt; }
            .leerdoelen-bank, .weefgetouw-header, #bewust-niet-opgenomen-wrapper, .footer, h1, .info-sectie, #print-btn, #import-btn, #export-btn { display: none !important; }
            .main-container { display: block !important; }
            .panel { box-shadow: none !important; border: none !important; padding: 0; }
            .weefgetouw-wrapper { padding-top: 0; }
            .leerdoel { border: 1px solid #ccc; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .grid-cell { border: 1px solid #ccc; }
            @page { size: A4 landscape; margin: 1cm; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Weefgetouw Digitale Geletterdheid</h1>
        <aside class="panel leerdoelen-bank">
            <details class="info-sectie" open>
                <summary>Achtergrond en uitleg</summary>
                <div id="info-content"></div>
            </details>
            <h2>Leerdoelen</h2>
            <div id="leerdoelen-container" class="drop-zone"></div>
        </aside>
        <main class="panel weefgetouw-wrapper">
            <div class="weefgetouw-header">
                <h2>Curriculum</h2>
                <div class="controls">
                    <button id="import-btn" class="button button-secondary">Importeer JSON</button>
                    <button id="export-btn" class="button button-secondary">Exporteer JSON</button>
                    <button id="print-btn" class="button">Print/PDF</button>
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                </div>
            </div>
            <div class="curriculum-grid" id="curriculum-grid"></div>
            <h3>Bewust niet opgenomen</h3>
            <div class="bewust-niet-opgenomen drop-zone" id="bewust-niet-opgenomen-container"></div>
        </main>
        <footer class="footer" id="footer-content"></footer>
    </div>
<script>
let toolData = {
  "info": {"paragrafen": ["In 2022/2023 heeft de werkgroep Digitale Geletterdheid van iXperium Nijmegen een weefgetouw ontwikkeld als hulpmiddel voor scholen om de inzet van onderwijs op digitaal geletterdheid concreet te maken.","Deelnemers waren de ict-coördinatoren van verschillende scholen uit de regio Nijmegen, waaronder Stichting Primair Onderwijs Groesbeek (SPOG), Optimus, Kans en Kleur, Stichting St. Josephscholen, evenals de HAN Pabo, het iXperiumlab en onderzoekers van iXperium.","Het weefgetouw biedt de mogelijkheid om vast te leggen op welke manier en in hoeverre de school momenteel aan de doelen van digitale geletterdheid werkt. Hierdoor ontstaat inzicht in welke doelen nog niet geïntegreerd zijn en vereist het een actieve keuze om deze al dan niet te integreren of geclusterd rondom specifieke thema's te organiseren.","Vragen over de bijbehorende werkvorm? 📧caroline.vanrens@han.nl | nieske.coetsier@han.nl"],"licentie": "Naamsvermelding-NietCommercieel 4.0 Internationaal (CC BY-NC 4.0) - iXperium Centre of Expertise"},
  "config": {"leerjaren": ["Leerjaar 1","Leerjaar 2","Leerjaar 3","Leerjaar 4","Leerjaar 5","Leerjaar 6","Leerjaar 7","Leerjaar 8"],"vakken": ["Taal - beschouwing","Taal - woordenschat","Taal - spelling","Begrijpend lezen","Schrijven","Rekenen","Wereldoriëntatie","SEO","Creatieve vakken","Digitale geletterdheid","Project"]},
  "inhoudslijnen": [] // Wordt extern geladen
};

document.addEventListener('DOMContentLoaded', () => {
    
    function initializeApp(data) {
        buildUI(data);
        setupEventListeners(data);
    }

    function buildUI(data) {
        const { info, inhoudslijnen, config } = data;
        const infoContent = document.getElementById('info-content');
        infoContent.innerHTML = '';
        info.paragrafen.forEach(pText => infoContent.appendChild(Object.assign(document.createElement('p'), { textContent: pText })));
        document.getElementById('footer-content').innerHTML = `&copy; ${new Date().getFullYear()} ${info.licentie}`;
        buildLeerdoelenBank(inhoudslijnen);
        buildCurriculumGrid(config);
    }

    function buildLeerdoelenBank(inhoudslijnen) {
        const container = document.getElementById('leerdoelen-container');
        container.innerHTML = '';
        inhoudslijnen.forEach(lijn => {
            const lijnEl = document.createElement('div');
            lijnEl.innerHTML = `<h3 class="inhoudslijn-header" style="border-color: var(--color-${lijn.id}-border)">${lijn.naam}</h3>`;
            
            lijn.subdomeinen.forEach(subdomein => {
                const subdomeinDetails = document.createElement('details');
                subdomeinDetails.className = 'subdomein-details';
                subdomeinDetails.open = true;
                
                const subdomeinSummary = document.createElement('summary');
                subdomeinSummary.innerHTML = `<h4>${subdomein.naam}</h4>`;
                subdomeinDetails.appendChild(subdomeinSummary);
                
                subdomein.labels.forEach(label => {
                    const labelDetails = document.createElement('details');
                    labelDetails.className = 'label-details';
                    
                    const labelSummary = document.createElement('summary');
                    labelSummary.className = 'label-summary';
                    labelSummary.textContent = label.naam;
                    labelDetails.appendChild(labelSummary);

                    const fasesWrapper = document.createElement('div');
                    fasesWrapper.className = 'fases-wrapper';
                    
                    const faseKolommen = [1, 2, 3].map(i => {
                        const kolom = document.createElement('div');
                        kolom.className = 'fase-kolom drop-zone';
                        kolom.id = `fase-kolom-${lijn.id}-${subdomein.naam.replace(/\s/g, '')}-${label.naam.replace(/\s/g, '')}-${i}`;
                        kolom.innerHTML = `<div class="fase-header">FASE ${i}</div>`;
                        return kolom;
                    });
                    
                    label.competenties.forEach(comp => {
                        const compEl = createLeerdoelElement(comp, lijn.id, faseKolommen[comp.fase - 1].id);
                        faseKolommen[comp.fase - 1].appendChild(compEl);
                    });

                    faseKolommen.forEach(kolom => fasesWrapper.appendChild(kolom));
                    labelDetails.appendChild(fasesWrapper);
                    subdomeinDetails.appendChild(labelDetails);
                });
                lijnEl.appendChild(subdomeinDetails);
            });
            container.appendChild(lijnEl);
        });
    }

    function buildCurriculumGrid({ leerjaren, vakken }) {
        const grid = document.getElementById('curriculum-grid');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `minmax(150px, auto) repeat(${leerjaren.length}, 1fr)`;
        
        grid.appendChild(document.createElement('div'));
        leerjaren.forEach(jaar => grid.appendChild(Object.assign(document.createElement('div'), { className: 'grid-header', textContent: jaar })));

        vakken.forEach(vak => {
            grid.appendChild(Object.assign(document.createElement('div'), { className: 'grid-row-header', textContent: vak }));
            leerjaren.forEach((_, i) => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell drop-zone';
                cell.id = `grid-cell-${vak.replace(/\s/g, '')}-${i + 1}`;
                grid.appendChild(cell);
            });
        });
    }

    function createLeerdoelElement(competentie, kleurId, originalParentId) {
        const el = document.createElement('div');
        el.className = 'leerdoel';
        el.id = competentie.id;
        el.dataset.color = kleurId;
        el.dataset.originalParent = originalParentId;
        el.draggable = true;
        el.textContent = competentie.tekst;
        return el;
    }

    function exportState() {
        const plaatsingen = {};
        document.querySelectorAll('.leerdoel').forEach(leerdoel => {
            const parentZone = leerdoel.closest('.drop-zone');
            if (parentZone) {
                plaatsingen[leerdoel.id] = parentZone.id;
            }
        });

        const exportData = { ...toolData, plaatsingen };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `weefgetouw-export-${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    function importState(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (!importedData.config || !importedData.inhoudslijnen || !importedData.plaatsingen) {
                    throw new Error("Ongeldig of incompleet JSON-bestand.");
                }
                
                toolData = { info: importedData.info, config: importedData.config, inhoudslijnen: importedData.inhoudslijnen };
                initializeApp(toolData);
                
                const { plaatsingen } = importedData;
                Object.keys(plaatsingen).forEach(leerdoelId => {
                    const leerdoelEl = document.getElementById(leerdoelId);
                    const parentZoneEl = document.getElementById(plaatsingen[leerdoelId]);
                    if (leerdoelEl && parentZoneEl) {
                        parentZoneEl.appendChild(leerdoelEl);
                    }
                });
            } catch (error) {
                alert("Fout bij importeren: " + error.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }
    
    function setupEventListeners() {
        let draggedItem = null;
        let currentDropZone = null;

        document.addEventListener('dragstart', e => {
            if (e.target.classList.contains('leerdoel')) {
                draggedItem = e.target;
                e.dataTransfer.setData('text/plain', draggedItem.id);
                setTimeout(() => draggedItem.classList.add('dragging'), 0);
            }
        });
        
        document.addEventListener('dragend', () => {
            if (draggedItem) draggedItem.classList.remove('dragging');
            if (currentDropZone) currentDropZone.classList.remove('drag-over');
            draggedItem = null;
            currentDropZone = null;
        });
        
        document.addEventListener('dragover', e => {
            e.preventDefault();
            const target = e.target.closest('.drop-zone');
            if (target !== currentDropZone) {
                if(currentDropZone) currentDropZone.classList.remove('drag-over');
                currentDropZone = target;
                if(currentDropZone) currentDropZone.classList.add('drag-over');
            }
        });

        document.addEventListener('drop', e => {
            e.preventDefault();
            if (currentDropZone && draggedItem) {
                if (currentDropZone.id === 'leerdoelen-container') {
                    const originalParent = document.getElementById(draggedItem.dataset.originalParent);
                    if (originalParent) originalParent.appendChild(draggedItem);
                } else {
                    currentDropZone.appendChild(draggedItem);
                }
            }
            if(currentDropZone) currentDropZone.classList.remove('drag-over');
        });

        document.getElementById('export-btn').addEventListener('click', exportState);
        document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', importState);
        document.getElementById('print-btn').addEventListener('click', () => window.print());
    }

    // --- Start de applicatie ---
    fetch('inhoudslijnen.json')
        .then(response => {
            if (!response.ok) {
                throw new Error(`Netwerkfout: Kan inhoudslijnen.json niet laden (status: ${response.status})`);
            }
            return response.json();
        })
        .then(loadedInhoudslijnen => {
            toolData.inhoudslijnen = loadedInhoudslijnen;
            initializeApp(toolData);
        })
        .catch(error => {
            console.error('Fatale fout bij het laden van de applicatie:', error);
            alert('Kan de leerdoelen niet laden. Zorg ervoor dat het bestand "inhoudslijnen.json" in dezelfde map staat als de HTML.\n\nDetails: ' + error.message);
        });
});
</script>
</body>
</html>
