<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Maak Embed Code</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2em;
      background: #f5f5f5;
    }
    label, input, button {
      font-size: 1rem;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 0.5em;
      margin-top: 0.5em;
      margin-bottom: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    input[type="number"] {
      max-width: 120px;
      display: inline-block;
      margin-right: 1em;
    }
    button {
      background: #0073e6;
      color: white;
      padding: 0.5em 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #005bb5;
    }
    #result {
      margin-top: 1.5em;
      padding: 1em;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #copyBtn {
      margin-top: 0.5em;
      background: #28a745;
    }
    #copyBtn:hover {
      background: #1e7e34;
    }
    #preview {
      margin-top: 2em;
    }
    iframe {
      border: none;
    }
  </style>
</head>
<body>
  <h1>Maak een embed code</h1>
  <form id="embedForm">
    <label for="videoUrl">Plak hier je video URL:</label>
    <input type="text" id="videoUrl" placeholder="https://..." required>

    <label for="width">Breedte:</label>
    <input type="number" id="width" value="640" required>
    <label for="height">Hoogte:</label>
    <input type="number" id="height" value="360" required>

    <button type="submit">Maak embed</button>
  </form>

  <div id="output" style="display:none;">
    <h2>Embed code:</h2>
    <div id="result"></div>
    <button id="copyBtn">Kopieer naar klembord</button>

    <div id="preview">
      <h2>Voorbeeld:</h2>
      <iframe id="previewFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const form = document.getElementById("embedForm");
    const output = document.getElementById("output");
    const result = document.getElementById("result");
    const copyBtn = document.getElementById("copyBtn");
    const previewFrame = document.getElementById("previewFrame");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const videoUrl = document.getElementById("videoUrl").value.trim();
      const width = document.getElementById("width").value || 640;
      const height = document.getElementById("height").value || 360;

      if (!videoUrl) return;

      const encodedUrl = encodeURIComponent(videoUrl);
      const iframeSrc = `https://ictoblog.com/embedvideo/index.html?video_url=${encodedUrl}`;
      const iframeCode = `<iframe
  src="${iframeSrc}"
  width="${width}"
  height="${height}"
  frameborder="0"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>`;

      result.textContent = iframeCode;
      previewFrame.src = iframeSrc;
      previewFrame.width = width;
      previewFrame.height = height;
      output.style.display = "block";
    });

    copyBtn.addEventListener("click", function() {
      const code = result.textContent;
      navigator.clipboard.writeText(code).then(() => {
        copyBtn.textContent = "Gekopieerd!";
        setTimeout(() => copyBtn.textContent = "Kopieer naar klembord", 2000);
      });
    });
  </script>
</body>
</html>
