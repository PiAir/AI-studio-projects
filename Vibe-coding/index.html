<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibecoding Wegwerpapplicaties</title>
    <style>
        :root {
            --primary-bg-color: #ffffff;
            --secondary-bg-color: #f8f9fa;
            --accent-color: #007bff;
            --header-color: #343a40;
            --text-color: #333;
            --nav-width: 320px;
            --border-color: #dee2e6;
            --header-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --body-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --header-height: 60px;
        }
        body {
            font-family: var(--body-font);
            margin: 0;
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-top: var(--header-height);
        }
        .app-header {
            background-color: var(--primary-bg-color);
            color: var(--header-color);
            padding: 0 40px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .app-header h1 {
            font-family: var(--header-font);
            font-size: 1.8em;
            margin: 0;
        }
        .container {
            display: flex;
        }
        nav {
            width: var(--nav-width);
            background-color: var(--primary-bg-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            height: calc(100vh - var(--header-height));
            overflow-y: auto;
            position: fixed;
            top: var(--header-height);
            box-sizing: border-box;
        }
        nav h2 {
            font-family: var(--header-font);
            color: #d6336c;
            font-size: 1.5em;
            margin-top: 0;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 10px;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        nav ul li a {
            display: block;
            padding: 10px 15px;
            text-decoration: none;
            color: #495057;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: background-color 0.3s;
            font-weight: 500;
        }
        nav ul li a:hover, nav ul li a.active {
            background-color: #e9ecef;
            color: #d6336c;
        }
        main {
            margin-left: var(--nav-width);
            padding: 20px 40px;
            width: calc(100% - var(--nav-width));
            box-sizing: border-box;
        }
        .content-wrapper {
             max-width: 900px;
        }
        .content-section {
            background-color: var(--primary-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        #content-title {
             font-family: var(--header-font);
             color: #343a40;
             border-bottom: 2px solid #d6336c;
             padding-bottom: 10px;
             font-size: 2.2em;
             margin-top: 0;
             margin-bottom: 25px;
        }
        .media-display {
            margin-bottom: 25px;
        }
        .media-display .toggle-button {
            display: none;
            margin-bottom: 15px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background-color: #f1f3f5;
            color: var(--header-color);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        .media-display .toggle-button:hover {
            background-color: #e9ecef;
        }
        .media-display img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }
        .media-display .demo-link {
            display: none;
            margin-top: 15px;
            font-weight: bold;
            text-decoration: none;
            color: var(--accent-color);
        }
         .media-display .demo-link:hover {
            text-decoration: underline;
        }
        .content-section h3 {
            font-family: var(--header-font);
            color: #d6336c;
            margin-top: 0;
            font-size: 1.6em;
            cursor: pointer;
        }
        .content-section h3:hover {
            text-decoration: underline;
        }
        .prompt {
            background-color: #f8f9fa;
            border-left: 4px solid #d6336c;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95em;
            display: none;
            border-radius: 0 5px 5px 0;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<header class="app-header">
    <h1 id="page-title">Vibecoding Wegwerpapplicaties</h1>
</header>

<div class="container">
    <nav>
        <h2>Applicaties</h2>
        <ul id="navList"></ul>
    </nav>
    <main>
        <div class="content-wrapper">
            <h1 id="content-title">Selecteer een voorbeeld</h1>
            
            <div id="media-container" class="media-display">
                 <button id="toggle-image-btn" class="toggle-button">Toon schermafbeelding</button>
                 <img id="content-image" src="" alt="">
                 <a id="content-demo-link" href="#" target="_blank" rel="noopener noreferrer" class="demo-link">🌐 Probeer een voorbeeld van de app uit</a>
            </div>

            <div id="app-content">
                <div class="content-section">
                    <h3>Functionaliteit</h3>
                    <p id="content-functionality"></p>
                </div>
                <div class="content-section">
                    <h3>Opzet</h3>
                    <p id="content-opzet"></p>
                </div>
                <div class="content-section">
                    <h3 id="prompt-title">Prompt (voor AI Studio)</h3>
                    <div id="content-prompt" class="prompt"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const pageTitle = document.getElementById('page-title');
        const navList = document.getElementById('navList');
        const contentTitle = document.getElementById('content-title');
        const appContentDiv = document.getElementById('app-content');
        
        const toggleImageBtn = document.getElementById('toggle-image-btn');
        const contentImage = document.getElementById('content-image');
        const contentDemoLink = document.getElementById('content-demo-link');

        const contentFunctionality = document.getElementById('content-functionality');
        const contentOpzet = document.getElementById('content-opzet');
        const promptTitle = document.getElementById('prompt-title');
        const contentPrompt = document.getElementById('content-prompt');

        let appData = [];

        async function initializeApp() {
            try {
                const response = await fetch('applications.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                appData = await response.json();

                pageTitle.textContent = `${appData.length} Vibecoding Wegwerpapplicaties`;
                populateNav(appData);

                const params = new URLSearchParams(window.location.search);
                const urlId = params.get('id');
                let initialIndex = 0;

                if (urlId) {
                    const requestedIndex = parseInt(urlId, 10) - 1;
                    if (requestedIndex >= 0 && requestedIndex < appData.length) {
                        initialIndex = requestedIndex;
                    } else {
                        console.warn(`ID ${urlId} is out of bounds. Defaulting to first item.`);
                    }
                }
                displayContent(initialIndex);
            } catch (error) {
                console.error('Error initializing application:', error);
                contentTitle.textContent = 'Fout bij laden';
                appContentDiv.innerHTML = '<p>Kon de applicatiegegevens niet laden. Controleer of het bestand "applications.json" in dezelfde map staat.</p>';
            }
        }

        function populateNav(data) {
            navList.innerHTML = '';
            data.forEach((app, index) => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `?id=${index + 1}`;
                a.textContent = app.title.split('–')[0].trim();
                a.dataset.index = index;
                li.appendChild(a);
                navList.appendChild(li);
            });
        }

        function displayContent(index) {
            if (!appData[index]) return;
            const app = appData[index];

            contentTitle.textContent = app.title;

            // Handle Image and Toggle Button
            if (app.image) {
                toggleImageBtn.style.display = 'inline-block';
                contentImage.src = app.image;
                contentImage.alt = `Afbeelding voor ${app.title}`;
                // Reset state on new content load
                contentImage.style.display = 'none';
                toggleImageBtn.textContent = 'Toon schermafbeelding';
            } else {
                toggleImageBtn.style.display = 'none';
                contentImage.style.display = 'none';
            }

            // Handle Demo Link
            contentDemoLink.style.display = app.demo ? 'inline-block' : 'none';
            if (app.demo) contentDemoLink.href = app.demo;
            
            // Handle Text Content
            contentFunctionality.innerHTML = app.functionality.replace(/\n/g, '<br>');
            contentOpzet.innerHTML = app.opzet.replace(/\n/g, '<br>');
            contentPrompt.innerHTML = app.prompt.replace(/\n/g, '<br>');
            
            appContentDiv.style.display = 'block';
            contentPrompt.style.display = 'none';

            document.querySelectorAll('#navList a').forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`#navList a[data-index='${index}']`);
            if (activeLink) activeLink.classList.add('active');

            const newUrl = `${window.location.pathname}?id=${parseInt(index) + 1}`;
            history.pushState({path: newUrl}, '', newUrl);
        }

        navList.addEventListener('click', function(e) {
            e.preventDefault();
            if (e.target.tagName === 'A') {
                displayContent(e.target.dataset.index);
            }
        });
        
        toggleImageBtn.addEventListener('click', function() {
            const isHidden = contentImage.style.display === 'none';
            contentImage.style.display = isHidden ? 'block' : 'none';
            toggleImageBtn.textContent = isHidden ? 'Verberg schermafbeelding' : 'Toon schermafbeelding';
        });

        promptTitle.addEventListener('click', function() {
            const isHidden = contentPrompt.style.display === 'none';
            contentPrompt.style.display = isHidden ? 'block' : 'none';
        });

        window.addEventListener('popstate', (event) => {
            initializeApp();
        });

        initializeApp();
    });
</script>

</body>
</html>
