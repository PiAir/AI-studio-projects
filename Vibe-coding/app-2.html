<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woordjes-Memory</title>
    <style>
        /* CSS Styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #f0f8ff;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #333;
        }

        #game-info {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #555;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            perspective: 1000px; /* Nodig voor het 3D-flip effect */
        }

        .card {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card.matched {
            border: 3px solid #28a745; /* Groene rand voor correcte paren */
            border-radius: 8px;
            cursor: default;
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-front {
            background-color: #ffffff;
            color: #333;
            transform: rotateY(180deg);
        }

        .card-back {
            background-color: #4a90e2;
            color: white;
            font-size: 40px;
        }

        #end-message {
            margin-top: 20px;
            font-size: 1.5em;
            color: #28a745;
            text-align: center;
        }

        #reset-button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            display: none; /* Standaard verborgen */
        }
    </style>
</head>
<body>

    <h1>Woordjes-Memory</h1>
    <div id="game-info">
        <span id="attempts-counter">Pogingen: 0</span>
    </div>

    <div id="game-board"></div>

    <div id="end-message"></div>
    <button id="reset-button">Opnieuw spelen</button>

    <script>
        // JavaScript Logic
        document.addEventListener('DOMContentLoaded', () => {
            const wordPairs = {
                "dog": "hond",
                "cat": "kat",
                "sun": "zon",
                "apple": "appel",
                "water": "water",
                "book": "boek"
            };

            const gameBoard = document.getElementById('game-board');
            const attemptsCounter = document.getElementById('attempts-counter');
            const endMessage = document.getElementById('end-message');
            const resetButton = document.getElementById('reset-button');
            
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let attempts = 0;
            let lockBoard = false;

            // Functie om het spel te initialiseren of te resetten
            function startGame() {
                // Reset variabelen
                matchedPairs = 0;
                attempts = 0;
                flippedCards = [];
                lockBoard = false;
                
                // Reset de weergave
                gameBoard.innerHTML = '';
                endMessage.textContent = '';
                resetButton.style.display = 'none';
                attemptsCounter.textContent = `Pogingen: ${attempts}`;

                // Maak een lijst van alle woorden (Engels en Nederlands)
                const gameWords = [...Object.keys(wordPairs), ...Object.values(wordPairs)];

                // Schud de woorden willekeurig
                gameWords.sort(() => 0.5 - Math.random());

                // Maak de kaartjes en voeg ze toe aan het bord
                gameWords.forEach(word => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.word = word;

                    card.innerHTML = `
                        <div class="card-face card-front">${word}</div>
                        <div class="card-face card-back">?</div>
                    `;
                    
                    card.addEventListener('click', flipCard);
                    gameBoard.appendChild(card);
                    cards.push(card);
                });
            }

            // Functie om een kaartje om te draaien
            function flipCard() {
                if (lockBoard) return; // Voorkom klikken tijdens de 'wacht' periode
                if (this === flippedCards[0]) return; // Voorkom dubbelklik op dezelfde kaart

                this.classList.add('flipped');

                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    updateAttempts();
                    checkForMatch();
                }
            }
            
            // Functie om het aantal pogingen bij te werken
            function updateAttempts() {
                attempts++;
                attemptsCounter.textContent = `Pogingen: ${attempts}`;
            }

            // Functie om te controleren of twee omgedraaide kaartjes een paar zijn
            function checkForMatch() {
                lockBoard = true; // Blokkeer het bord
                const [cardOne, cardTwo] = flippedCards;
                const wordOne = cardOne.dataset.word;
                const wordTwo = cardTwo.dataset.word;

                const isMatch = (wordPairs[wordOne] === wordTwo) || (wordPairs[wordTwo] === wordOne);

                if (isMatch) {
                    disableCards();
                } else {
                    unflipCards();
                }
            }

            // Functie om kaartjes te 'blokkeren' als het een match is
            function disableCards() {
                const [cardOne, cardTwo] = flippedCards;
                cardOne.removeEventListener('click', flipCard);
                cardTwo.removeEventListener('click', flipCard);
                
                // Voeg een 'matched' klasse toe voor de groene rand
                cardOne.classList.add('matched');
                cardTwo.classList.add('matched');

                matchedPairs++;
                resetBoard();
                
                // Controleer of het spel voorbij is
                if (matchedPairs === Object.keys(wordPairs).length) {
                    endGame();
                }
            }

            // Functie om de kaartjes terug te draaien als het geen match is
            function unflipCards() {
                setTimeout(() => {
                    const [cardOne, cardTwo] = flippedCards;
                    cardOne.classList.remove('flipped');
                    cardTwo.classList.remove('flipped');
                    resetBoard();
                }, 1000); // Wacht 1 seconde
            }
            
            // Functie om de status na een beurt te resetten
            function resetBoard() {
                [flippedCards, lockBoard] = [[], false];
            }
            
            // Functie om het spel te beëindigen
            function endGame() {
                endMessage.textContent = 'Goed gedaan, alle woorden gevonden!';
                resetButton.style.display = 'block';
            }

            // Event listener voor de 'Opnieuw spelen' knop
            resetButton.addEventListener('click', startGame);

            // Start het spel voor de eerste keer
            startGame();
        });
    </script>

</body>
</html>
